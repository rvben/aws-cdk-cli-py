name: Check for AWS CDK Updates

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual triggering

# Permissions needed to push tags
permissions:
  contents: write  # Needed for pushing tags

# Serialize runs so a scheduled run and a manual dispatch can never race to
# create the same tag. A queued run only starts after the active one finishes,
# so its fresh checkout already contains any tag the previous run pushed and it
# then exits cleanly as "up to date". Never cancel an in-flight run mid-push.
concurrency:
  group: check-cdk-updates
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Set timeout to avoid wasting minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all tags and history

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Runs the same `make check-cdk-update` target that runs locally.
      # The check is pure Python (no npm/npx); it fails the job on any error
      # rather than silently reporting "no update".
      - name: Check for new CDK version
        id: check
        run: make check-cdk-update

      # Only runs these steps if a new version is detected
      - name: Update Node.js to latest LTS patch
        if: steps.check.outputs.has_new_version == 'true'
        run: |
          # Detection is tested Python behind make targets (see scripts/update_node_version.py).
          # A Node.js patch must never block a CDK release, so detection failure is a soft skip.
          CURRENT_NODE=$(make -s node-current-version)
          LATEST_NODE=$(make -s node-latest-version || true)

          if [ -z "$LATEST_NODE" ]; then
            echo "::warning::Could not determine latest Node.js version, skipping update"
            echo "node_updated=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "Current Node.js: ${CURRENT_NODE}, Latest: ${LATEST_NODE}"

          if [ "$CURRENT_NODE" != "$LATEST_NODE" ]; then
            if python3 scripts/update_node_version.py "$LATEST_NODE"; then
              echo "node_updated=true" >> $GITHUB_ENV
              echo "node_version=${LATEST_NODE}" >> $GITHUB_ENV
            else
              echo "::warning::Node.js update to ${LATEST_NODE} failed, continuing with ${CURRENT_NODE}"
              git checkout -- aws_cdk_cli/constants.py
              echo "node_updated=false" >> $GITHUB_ENV
            fi
          else
            echo "Node.js already up to date"
            echo "node_updated=false" >> $GITHUB_ENV
          fi

      - name: Configure Git
        if: steps.check.outputs.has_new_version == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit Node.js update
        if: steps.check.outputs.has_new_version == 'true' && env.node_updated == 'true'
        run: |
          git add aws_cdk_cli/constants.py
          git commit -m "chore: update bundled Node.js to ${node_version}"
          git push https://${{ secrets.GH_PAT }}@github.com/${GITHUB_REPOSITORY}.git HEAD:main

      - name: Create and push tag
        if: steps.check.outputs.has_new_version == 'true'
        run: |
          NEW_VERSION="${{ steps.check.outputs.latest_version }}"
          echo "Creating tag v${NEW_VERSION}"

          # Create and push the tag with PAT to trigger other workflows
          git tag -a "v${NEW_VERSION}" -m "AWS CDK version ${NEW_VERSION}"
          git push https://${{ secrets.GH_PAT }}@github.com/${GITHUB_REPOSITORY}.git "v${NEW_VERSION}"

      - name: Trigger build-and-publish workflow
        if: steps.check.outputs.has_new_version == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.check.outputs.latest_version }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/$REPO/actions/workflows/build-and-publish.yml/dispatches \
            -d '{
              "ref": "refs/tags/v'$VERSION'",
              "inputs": {"version": "'$VERSION'"}
            }'

      - name: Create Release Info
        if: steps.check.outputs.has_new_version == 'true'
        run: |
          echo "::notice::Created new tag v${{ steps.check.outputs.latest_version }} for AWS CDK update"
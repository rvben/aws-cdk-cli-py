name: Check for AWS CDK Updates

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

# Serialize runs so a scheduled run and a manual dispatch can never release the
# same version twice. A queued run only starts after the active one finishes,
# so it sees the publish the previous run made and exits cleanly as "up to
# date". Never cancel an in-flight run mid-publish.
concurrency:
  group: check-cdk-updates
  cancel-in-progress: false

jobs:
  check:
    name: Compare published version against upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_new_version: ${{ steps.check.outputs.has_new_version }}
      version: ${{ steps.check.outputs.latest_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Runs the same `make check-cdk-update` target that runs locally.
      # The check is pure Python (no npm/npx); it fails the job on any error
      # rather than silently reporting "no update".
      #
      # The already-released version comes from PyPI, not from a git tag. A tag
      # records "done" the moment it exists, so a run that tagged and then
      # failed to publish would make that version invisible to every later run,
      # permanently. Reading PyPI means such a release is simply retried here on
      # the next run.
      - name: Check for new CDK version
        id: check
        run: make check-cdk-update

  # Calling the release workflow instead of pushing a tag to trigger it is what
  # lets this run on the default GITHUB_TOKEN: a token-made push deliberately
  # does not start another workflow, so a tag-triggered design needs a personal
  # access token that must be created, stored and rotated by hand.
  release:
    name: Release
    needs: check
    if: needs.check.outputs.has_new_version == 'true'
    uses: ./.github/workflows/build-and-publish.yml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  # The tag records what shipped; it is deliberately not the trigger. Creating
  # it only after a successful publish keeps a failed release retryable, since
  # the next run compares against PyPI and finds the version still missing.
  tag:
    name: Tag the released commit
    needs: [check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create and push tag
        env:
          RELEASED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "v${RELEASED_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASED_VERSION} already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${RELEASED_VERSION}" -m "AWS CDK version ${RELEASED_VERSION}"
          git push origin "refs/tags/v${RELEASED_VERSION}"
          echo "::notice::Tagged v${RELEASED_VERSION}"

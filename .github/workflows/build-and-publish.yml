name: Build and Publish Package

on:
  push:
    tags:
      - 'v*'  # Trigger on any tag starting with v
  workflow_dispatch:
    inputs:
      version:
        description: 'CDK Version to build and publish'
        required: true
        type: string
  # Called directly by check-cdk-version.yml. Invoking this workflow rather
  # than relying on a tag push to trigger it is what removes the need for a
  # personal access token: a push made with the default GITHUB_TOKEN
  # deliberately does not start another workflow, but a workflow_call does.
  workflow_call:
    inputs:
      version:
        description: 'CDK Version to build and publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']  # Test with oldest and newest supported Python

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Keyed off inputs.version rather than github.event_name: under
      # workflow_call the event name is the CALLER's event (schedule), so a
      # push-vs-dispatch test would silently take the wrong branch. The inputs
      # context is populated for both workflow_dispatch and workflow_call, and
      # is empty for a tag push.
      - name: Get version from tag or input
        id: get_version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            echo "Error: '${VERSION}' is not a valid release version" >&2
            exit 1
          fi
          # A .postN release republishes the same upstream CDK version
          CDK_VERSION="${VERSION%%.post*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "cdk_version=${CDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Wrapper version: ${VERSION}, CDK version: ${CDK_VERSION}"

      - name: Install uv
        shell: bash
        run: |
          pip install uv

      - name: Run tests with make
        shell: bash
        env:
          CDK_VERSION: ${{ steps.get_version.outputs.cdk_version }}
        run: |
          # Ensure make is installed on Windows
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            choco install make
          fi

          # Download CDK and Node.js binaries first
          make download-cdk

          # Run tests
          make test

  build-and-publish:
    name: Build and publish package
    needs: test  # Only run after tests pass on all platforms
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Get all tags for proper versioning

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # See the note on the same step in the test job: the version must come
      # from the inputs context, not from github.event_name.
      - name: Get version from tag or input
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            echo "Error: '${VERSION}' is not a valid release version" >&2
            exit 1
          fi
          CDK_VERSION="${VERSION%%.post*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "cdk_version=${CDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Wrapper version: ${VERSION}, CDK version: ${CDK_VERSION}"

      - name: Install build dependencies
        run: |
          pip install uv twine

      - name: Build package with make
        env:
          CDK_VERSION: ${{ steps.get_version.outputs.cdk_version }}
          WRAPPER_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          echo "Building CDK ${CDK_VERSION} as wrapper version ${WRAPPER_VERSION}"
          make build

      - name: Upload package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI with make
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          make publish-test

      - name: Publish to PyPI with make
        if: success()
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          make publish-prod